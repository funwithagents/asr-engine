# Continuous integration — specs/ci.md.
#
# Both test tiers on GitHub's hosted runners, on every pull request and push to main,
# five jobs side by side: `check` (lint, format, types) on Linux; `fast-tier` once per
# supported platform — Linux, macOS, Windows — since the fast tier needs no network,
# no credentials and no sound device, and is where a platform's own code paths (file
# encodings, paths, the event loop, the lock's markers) meet a machine of that
# platform; and `e2e`, the live tier on Linux, whose scenarios are platform-independent.
# None waits on another: a run takes as long as its slowest job. No secret is needed:
# without DEEPGRAM_API_KEY the per-module cases skip, and the spec's expected-skips
# table says which.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, format, types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (default groups, against the lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright

  fast-tier:
    name: fast tier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One entry per supported platform (specs/project.md "Platforms"); one platform's
      # failure leaves the others running. The tier stubs sounddevice, so no entry needs
      # PortAudio or any other system package.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (default groups, against the lock)
        run: uv sync --locked
      - name: Fast tier
        run: uv run pytest

  e2e:
    name: live tier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The live tier imports asr_engine.audio for real; on Linux sounddevice loads the
      # system PortAudio (its macOS and Windows wheels bundle it).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 libportaudio2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (default groups, against the lock)
        run: uv sync --locked
      - name: Live tier
        # The Deepgram key, when the repository holds it as a secret: the two Deepgram
        # conformance cases run; absent (or on a fork's pull request, which never
        # receives a secret) the variable is empty and they skip. kyutai always skips:
        # local models are opt-in (specs/ci.md "Expected skips").
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: uv run pytest tests-e2e -rs
