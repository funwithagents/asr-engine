[project]
name = "asr-mcp"
version = "0.1.0"
description = "Real-time ASR MCP server"
readme = "README.md"
authors = [
    { name = "thervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "sounddevice",
    "numpy",
    "deepgram-sdk",
]

[project.scripts]
asr-mcp-server = "asr_mcp.cli:main"
asr-mcp-client = "asr_mcp.asr_resource_client:main"
asr-to-terminal = "asr_mcp.asr_to_terminal:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv_build]
include = ["src/asr_mcp/sounds/*.wav"]

[tool.ruff]
target-version = "py311"  # keep in sync with requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # ruff defaults (E4/E7/E9/F) + isort import ordering

[tool.pyright]
include = ["src", "tests", "tests-e2e"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in
# (run explicitly with `uv run pytest tests-e2e`).
testpaths = ["tests"]
pythonpath = ["tests-e2e"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = [
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
    "ignore::DeprecationWarning:deepgram",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-timeout",
    "ruff>=0.16.5",
]
