[project]
name = "asr-engine"
version = "0.1.0"
description = "Real-time ASR engine with an MCP server"
readme = "README.md"
authors = [
    { name = "thervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
    "soundfile",
]

[project.optional-dependencies]
# ASR provider backends. No provider is a core dependency (and none is the
# default): install the extra for the backend you select in engine.module.type.
# See specs/asr-module-interface.md "Optional dependencies (extras)".
deepgram = [
    "deepgram-sdk",
]
# The MCP server (asr-engine-mcp). The plain SDK, not mcp[cli]: the cli extra
# only serves the SDK's own `mcp dev` tooling. uvicorn is imported directly.
# <2: mcp 2.x renamed FastMCP (mcp.server.fastmcp is gone).
# See specs/project.md "Dependency strategy for transports".
mcp = [
    "mcp<2",
    "uvicorn",
]
# Local on-device Kyutai STT (module type `kyutai`), one extra per backend — see
# specs/modules/kyutai.md. Both are exclusive with mlx-audio, and so out of `all`
# and `dev`: install them in an environment of their own (see [tool.uv]
# conflicts). The marker is load-bearing: mlx publishes no Linux wheels, so an
# unmarked entry would break `uv lock` there; with it the extra
# resolves to nothing off Apple Silicon.
kyutai-mlx = [
    "moshi-mlx>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
kyutai-torch = [
    "moshi>=0.2.11",
]
# Mistral Voxtral realtime (module type `mistral_realtime`) — see specs/modules/mistral.md.
# The module speaks the WebSocket protocol directly; >=14 for websockets.connect's
# asyncio client with `additional_headers`.
mistral = [
    "websockets>=14",
]
# Any server speaking the OpenAI Realtime transcription protocol (module type
# `openai_realtime_compatible`) — see specs/modules/openai-realtime-compatible.md.
# A protocol module has no provider, so its extra is named after the module.
openai-realtime-compatible = [
    "websockets>=14",
]
# Any server implementing OpenAI's POST /v1/audio/transcriptions (module type
# `openai_transcriptions_compatible`) — see
# specs/modules/openai-transcriptions-compatible.md. A protocol module, named
# like the one above.
openai-transcriptions-compatible = [
    "httpx>=0.27",
]
# Local batch STT on Apple Silicon through the mlx-audio runner (module type
# `mlx_audio`) — see specs/modules/mlx-audio.md. One runner, many model families
# (Parakeet, Whisper, Qwen3-ASR, …). The marker is load-bearing, as for
# kyutai-mlx: mlx publishes no Linux/Windows wheels. Keep in sync with `dev`.
mlx-audio = [
    "mlx-audio[stt]>=0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Silero VAD (engine.vad.type `silero`) — see specs/vad.md. onnxruntime runs
# upstream's ONNX model, downloaded on first use (the silero-vad package itself
# depends on torch); soxr
# resamples the gate's analysis copy when the pipeline rate is not 8/16 kHz.
# onnxruntime publishes no Intel macOS wheel, hence the marker (best-effort
# platform, see specs/project.md).
silero = [
    "onnxruntime; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "soxr",
]
# Every provider and transport extra in one install (`pip install 'asr-engine[all]'`).
# Add each new extra here — the one exception is the Kyutai extras, which cannot
# share an environment with mlx-audio — and *separately* decide whether the dev
# group below needs it (see specs/project.md "Exclusive extras").
all = [
    "asr-engine[deepgram,mcp,mistral,mlx-audio,openai-realtime-compatible,openai-transcriptions-compatible,silero]",
]

[project.scripts]
# The only console script. Client-side apps live in examples/ (outside the
# wheel) and run via `python -m examples.…` — see specs/project.md.
asr-engine-mcp = "asr_engine.mcp_server_cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv_build]
include = ["src/asr_engine/sounds/*.wav"]

[tool.ruff]
target-version = "py311"  # keep in sync with requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # ruff defaults (E4/E7/E9/F) + isort import ordering

[tool.pyright]
include = ["src", "tests", "tests-e2e", "examples"]
extraPaths = ["tests-e2e"]  # as pytest's pythonpath: tests/ may import the e2e helpers
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in
# (run explicitly with `uv run pytest tests-e2e`).
testpaths = ["tests"]
# "." so both tiers can import the examples/ apps as a namespace package;
# "tests-e2e" so e2e helpers import as top-level modules.
pythonpath = [".", "tests-e2e"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = [
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
    "ignore::DeprecationWarning:deepgram",
]

[tool.uv]
# pyright/Pylance type-check examples/ (which imports gradio), so the demo group
# is synced by default — the dev venv always has gradio. gradio stays out of
# [project.dependencies], so library consumers never pull it.
default-groups = ["dev", "demo"]
# The Kyutai extras cannot share an environment with mlx-audio: moshi-mlx pins
# mlx<0.27 and sounddevice==0.5, moshi pins sounddevice==0.5 and
# huggingface-hub<1.0, and mlx-audio needs mlx>=0.31, sounddevice>=0.5.3 and
# huggingface-hub>=1.0. mlx-audio wins `all` and `dev` (moshi-mlx is unmaintained);
# Kyutai gets its own environment (.venv-kyutai). See specs/project.md
# "Exclusive extras".
conflicts = [
    [{ extra = "kyutai-mlx" }, { extra = "mlx-audio" }],
    [{ extra = "kyutai-torch" }, { extra = "mlx-audio" }],
    [{ extra = "kyutai-mlx" }, { extra = "all" }],
    [{ extra = "kyutai-torch" }, { extra = "all" }],
    [{ extra = "kyutai-mlx" }, { group = "dev" }],
    [{ extra = "kyutai-torch" }, { group = "dev" }],
]

[dependency-groups]
dev = [
    # The extras contributors need, named explicitly rather than via `all`, so
    # pyright and the tests see every provider module and the MCP server without
    # every contributor paying for a heavy backend. `all` stays the public
    # "everything" target. See specs/project.md. mlx-audio is in (a no-op off
    # Apple Silicon); the Kyutai extras cannot be (see [tool.uv] conflicts), and
    # their tests use a fake backend. silero is light (onnxruntime + soxr), so
    # the fast tier runs the real VAD model.
    "asr-engine[deepgram,mcp,mistral,openai-realtime-compatible,openai-transcriptions-compatible,silero]",
    # The mlx-audio extra's package, named directly: uv (0.11) silently installs
    # nothing for a self-referenced extra that sits in a declared conflict, so
    # "asr-engine[mlx-audio]" here would be a no-op. Keep in sync with the extra.
    "mlx-audio[stt]>=0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyright>=1.1.411",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-timeout",
    "ruff>=0.16.5",
]
# Optional: the examples/ Gradio demo (see specs/gradio-demo.md). Not a core
# dependency — `import asr_engine` and the MCP server stay lean without it.
demo = [
    "gradio",
]

