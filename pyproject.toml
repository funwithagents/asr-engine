[project]
name = "asr-mcp"
version = "0.1.0"
description = "Real-time ASR MCP server"
readme = "README.md"
authors = [
    { name = "thervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "sounddevice",
    "numpy",
    "deepgram-sdk",
]

[project.scripts]
asr-mcp-server = "asr_mcp.cli:main"
asr-mcp-client = "asr_mcp.client:main"
asr-to-terminal = "asr_mcp.asr_to_terminal:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "tests-e2e"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]
